{% if page.has_other_pages %}<nav class="mt-4 flex gap-3 text-sm" aria-label="Paginación">{% if page.has_previous %}<a class="btn-secondary" href="?{{ request.GET.urlencode }}&amp;pagina={{ page.previous_page_number }}">Anterior</a>{% endif %}<span class="self-center">Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="btn-secondary" href="?{{ request.GET.urlencode }}&amp;pagina={{ page.next_page_number }}">Siguiente</a>{% endif %}</nav>{% endif %}
