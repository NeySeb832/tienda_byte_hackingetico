# Render Blueprint de Byte (docs/despliegue.md). Secretos: generados por Render o cargados a mano
# (sync: false); ninguno vive en el repositorio.
previews:
  generation: off

databases:
  - name: byte-db
    plan: basic-256mb
    databaseName: byte
    user: byte
    postgresMajorVersion: "17"
    ipAllowList: [] # solo red privada de Render

services:
  - type: keyvalue
    name: byte-valkey
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction # colas de Celery: no se descartan tareas

  - type: web
    name: byte-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The BI lake lives on this service's disk: build it at start-up when missing.
    dockerCommand: sh deploy/start-web.sh
    healthCheckPath: /healthz
    # Render runs commands without a shell or quote parsing: use scripts.
    preDeployCommand: sh deploy/predeploy.sh
    autoDeploy: false # despliega el job "deploy" de CI cuando todo pasa
    disk:
      name: byte-lake
      mountPath: /var/data
      sizeGB: 1
    envVars: &shared
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: byte-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: byte-valkey
          property: connectionString
      - key: BYTE_FIELD_ENCRYPTION_KEYS
        generateValue: true # se deriva una clave Fernet (apps/core/crypto.py)
      - key: BYTE_BLIND_INDEX_KEY
        generateValue: true
      - key: BYTE_CLIENT_IP_HEADER
        value: HTTP_CF_CONNECTING_IP # Cloudflare delante de Render; REMOTE_ADDR es el proxy
      - key: BYTE_LOGIN_CAPTCHA_AFTER_FAILURES
        value: "0" # CAPTCHA en todo inicio de sesión (pentest PT-01)
      - key: BYTE_PAYMENT_GATEWAY
        value: fake # cambiar a wompi al cargar las llaves del sandbox
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend # correos al log hasta configurar Brevo
      - key: DJANGO_USE_S3
        value: "false"
      - key: BYTE_DATA_LAKE_DIR
        value: /var/data/lake
      - key: BYTE_DEMO_PASSWORD
        generateValue: true # visible en el panel de Render (usuarios demo)

  - type: worker
    name: byte-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config worker -l INFO --concurrency 2
    autoDeploy: false
    envVars: *shared

  - type: worker
    name: byte-beat
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    autoDeploy: false
    envVars: *shared
