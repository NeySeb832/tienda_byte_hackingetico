{% load static money %}<article class="product-card group">
  <div class="product-media">
    <img src="{% static product.image.file %}" width="{{ product.image.width }}" height="{{ product.image.height }}" alt="{{ product.image.alt }}" loading="lazy" decoding="async">
    <span class="condition-badge {{ product.condition_class }}">{{ product.condition }}</span>
  </div>
  <div class="flex flex-1 flex-col p-4">
    <p class="text-[11px] font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400">{{ product.brand }}</p>
    <h3 class="mt-1 font-semibold leading-snug text-slate-900 dark:text-white">{{ product.name }}</h3>
    <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">{{ product.specs }}</p>
    <div class="mt-auto pt-4">
      <p class="price">{{ product.price|cop }}</p>
      <p class="mt-0.5 text-xs {% if product.free_shipping %}font-semibold text-emerald-700 dark:text-emerald-300{% else %}text-slate-500 dark:text-slate-400{% endif %}">{% if product.free_shipping %}Envío gratis{% else %}IVA incluido{% endif %}</p>
      <button type="button" class="btn-cart"><svg class="size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"/></svg>Agregar al carrito</button>
    </div>
  </div>
</article>
