{% load allauth %}<div class="form-field">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}
  <label class="form-check" for="{{ attrs.id }}">
    <input type="{{ attrs.type }}"{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}{% if attrs.checked %} checked{% endif %}{% if attrs.required %} required{% endif %}{% if attrs.disabled %} disabled{% endif %}>
    <span>{% slot label %}{% endslot %}</span>
  </label>
  {% elif attrs.type == "textarea" %}
  <label class="form-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  <textarea{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.rows %} rows="{{ attrs.rows }}"{% endif %}{% if attrs.required %} required{% endif %}{% if attrs.readonly %} readonly{% endif %}{% if attrs.disabled %} disabled{% endif %}{% if attrs.placeholder %} placeholder="{{ attrs.placeholder }}"{% endif %}>{% slot value %}{% endslot %}</textarea>
  {% else %}
  <label class="form-label" for="{{ attrs.id }}">{% slot label %}{% endslot %}</label>
  <input type="{{ attrs.type }}"{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.value is not None %} value="{{ attrs.value }}"{% endif %}{% if attrs.placeholder %} placeholder="{{ attrs.placeholder }}"{% endif %}{% if attrs.autocomplete %} autocomplete="{{ attrs.autocomplete }}"{% endif %}{% if attrs.required %} required{% endif %}{% if attrs.readonly %} readonly{% endif %}{% if attrs.disabled %} disabled{% endif %}>
  {% endif %}
  {% if slots.help_text %}<p class="form-help">{% slot help_text %}{% endslot %}</p>{% endif %}
  {% for error in attrs.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
</div>
